name: Browser Panel V323

on:
  push:
    branches: [main]
    paths:
      - 'auth-compat-v323-browser-panel.js'
      - 'public/js/ucan_v323_browser_panel.js'
      - 'public/js/ucan_v323_visual_comfort.js'
      - 'public/js/ucan_v323_social_loader.js'
      - 'verify_v323_browser_panel.js'
      - 'verify_v322_pure_stairs.js'
      - 'verify_voice_rooms_v306.js'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/browser-panel-v323.yml'
  pull_request:
    paths:
      - 'auth-compat-v323-browser-panel.js'
      - 'public/js/ucan_v323_browser_panel.js'
      - 'public/js/ucan_v323_visual_comfort.js'
      - 'public/js/ucan_v323_social_loader.js'
      - 'verify_v323_browser_panel.js'
      - 'verify_v322_pure_stairs.js'
      - 'verify_voice_rooms_v306.js'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/browser-panel-v323.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Validate every browser panel control
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run repository tests
        run: npm test
      - name: Start V323 application
        env:
          PORT: '3230'
          DATA_DIR: ${{ runner.temp }}/ucan-v323-data
          ADMIN_INITIAL_USERNAME: admin
          ADMIN_INITIAL_PASSWORD: Panel-V323-Admin7!
          ADMIN_INITIAL_EMAIL: admin-v323@example.test
        run: |
          mkdir -p "$DATA_DIR"
          node -r ./auth-compat-v323-browser-panel.js server.js > "$RUNNER_TEMP/v323-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/v323-server.pid"
          for attempt in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:3230/health > "$RUNNER_TEMP/health.json"; then exit 0; fi
            sleep 0.3
          done
          cat "$RUNNER_TEMP/v323-server.log"
          exit 1
      - name: Verify version flags
        run: |
          curl -fsS http://127.0.0.1:3230/version > "$RUNNER_TEMP/version.json"
          node - <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/version.json','utf8'));
          const required=[
            'singleMovementLoop','groundResolvedOncePerMovementFrame','singlePanelController',
            'legacyBaseHudHandlersDisabled','legacyEnvironmentPanelHandlersDisabled',
            'legacyV316PanelControllerDisabled','everyLeftPanelControlMapped','panelSelfTestAvailable',
            'qualityControlsIntegrated','accessibilityControlsIntegrated','destinationControlsIntegrated','xrControlsIntegrated'
          ];
          if(value.version!=='V323'||value.revision!=='R27'||required.some(key=>value[key]!==true)){
            console.error(value);process.exit(1);
          }
          NODE
      - name: Login and inspect authenticated campus
        run: |
          JAR="$RUNNER_TEMP/cookies.txt"
          curl -fsS -c "$JAR" -H 'Content-Type: application/json' \
            -d '{"login":"admin","password":"Panel-V323-Admin7!"}' \
            http://127.0.0.1:3230/api/auth/login > "$RUNNER_TEMP/login.json"
          curl -fsS -b "$JAR" http://127.0.0.1:3230/campus > "$RUNNER_TEMP/campus.html"
          grep -q 'data-ucan-v323-locomotion="true"' "$RUNNER_TEMP/campus.html"
          grep -q 'data-ucan-v323-stair-authority="true"' "$RUNNER_TEMP/campus.html"
          grep -q 'data-ucan-v323-visual-comfort="true"' "$RUNNER_TEMP/campus.html"
          grep -q 'data-ucan-v323-browser-panel="true"' "$RUNNER_TEMP/campus.html"
          grep -q 'data-ucan-v323-social-loader="true"' "$RUNNER_TEMP/campus.html"
          ! grep -q 'ucan_v322_visual_comfort.js' "$RUNNER_TEMP/campus.html"
          ! grep -q 'ucan_v318_stairs_all_environments.js' "$RUNNER_TEMP/campus.html"
          ! grep -q 'ucan_v319_vr_accessibility.js' "$RUNNER_TEMP/campus.html"
          ! grep -q 'ucan_v321_stair_authority.js' "$RUNNER_TEMP/campus.html"
      - name: Verify base panel handlers are disabled
        run: |
          JAR="$RUNNER_TEMP/cookies.txt"
          curl -fsS -b "$JAR" http://127.0.0.1:3230/js/ucan_babylon_mall_v265_accounts_avatars.js > "$RUNNER_TEMP/base.js"
          grep -q '__UCAN_LEGACY_BASE_HUD_DISABLED_V323__' "$RUNNER_TEMP/base.js"
          grep -q '__UCAN_LEGACY_ENVIRONMENT_PANEL_DISABLED_V323__' "$RUNNER_TEMP/base.js"
          ! grep -q '^[[:space:]]*setupHUD(scene, camera);' "$RUNNER_TEMP/base.js"
          ! grep -q '^[[:space:]]*setupEnvironmentControls(scene, camera);' "$RUNNER_TEMP/base.js"
          grep -q '__UCAN_PANEL_STATE_V323__?.autoQuality' "$RUNNER_TEMP/base.js"
      - name: Verify locomotion exposes panel bridge once
        run: |
          JAR="$RUNNER_TEMP/cookies.txt"
          curl -fsS -b "$JAR" http://127.0.0.1:3230/js/ucan_v316_complete_browser_vr_audit.js > "$RUNNER_TEMP/locomotion.js"
          grep -q '__UCAN_LOCOMOTION_CONTROLS_V323__' "$RUNNER_TEMP/locomotion.js"
          grep -q '__UCAN_LEGACY_PANEL_CONTROLLER_DISABLED_V323__' "$RUNNER_TEMP/locomotion.js"
          ! grep -q '^[[:space:]]*installPanelController();' "$RUNNER_TEMP/locomotion.js"
          grep -q '__UCAN_APPLY_PANEL_QUALITY_V323__' "$RUNNER_TEMP/locomotion.js"
      - name: Verify render parity respects panel quality
        run: |
          JAR="$RUNNER_TEMP/cookies.txt"
          curl -fsS -b "$JAR" http://127.0.0.1:3230/js/ucan_v314_render_parity.js > "$RUNNER_TEMP/parity.js"
          grep -q 'panelScale=window.__UCAN_APPLY_PANEL_QUALITY_V323__' "$RUNNER_TEMP/parity.js"
          grep -q '__UCAN_VISUAL_COMFORT_V323__' "$RUNNER_TEMP/parity.js"
      - name: Stop application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/v323-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/v323-server.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/v323-server.log" ]; then tail -n 180 "$RUNNER_TEMP/v323-server.log"; fi