name: Validar Global V304 R5
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-v304-r5:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis y auditorías R4 R5
        run: |
          npm run check
          npm run audit:quest-v304-r4
          npm run audit:global-v304-r5

      - name: Iniciar servidor autenticado
        env:
          PORT: 3018
          ADMIN_INITIAL_PASSWORD: GitHub-Test-UCAN-2026!
        run: |
          npm start > /tmp/ucan-v304-r5.log 2>&1 &
          echo $! > /tmp/ucan-v304-r5.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3018/health > /tmp/health-v304-r5.json && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3018/js/ucan_v304_quest_glass_rails_holiday_r4.js?build=V304-20260725-QUEST-GLASS-RAILS-HOLIDAY-R4" > /tmp/quest-v304-r4.js
          curl -fsS "http://127.0.0.1:3018/js/ucan_v304_r4_geometry_protection.js?build=V304-20260725-R4-GEOMETRY-PROTECTION" > /tmp/protection-v304-r4.js
          curl -fsS "http://127.0.0.1:3018/js/ucan_v304_global_glass_signs_r5.js?build=V304-20260725-GLOBAL-GLASS-UPRIGHT-SIGNS-R5" > /tmp/global-v304-r5.js
          curl -fsS "http://127.0.0.1:3018/js/ucan_v266_keyboard_jump.js" > /tmp/keyboard-v266.js
          curl -fsS http://127.0.0.1:3018/version > /tmp/version-v304-r5.json
          CI_USER="civ304r5${GITHUB_RUN_ID}"
          curl -fsS -c /tmp/cookies-v304-r5.txt \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${CI_USER}\",\"displayName\":\"CI Global V304 R5\",\"email\":\"${CI_USER}@example.test\",\"password\":\"CI-V304-R5-2026!\"}" \
            http://127.0.0.1:3018/api/auth/register > /tmp/register-v304-r5.json
          curl -fsS -D /tmp/campus-v304-r5.headers -b /tmp/cookies-v304-r5.txt http://127.0.0.1:3018/campus > /tmp/campus-v304-r5.html

      - name: Validar JavaScript servido
        run: |
          node --check /tmp/quest-v304-r4.js
          node --check /tmp/protection-v304-r4.js
          node --check /tmp/global-v304-r5.js
          node --check /tmp/keyboard-v266.js
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('/tmp/global-v304-r5.js', 'utf8');
          const required = [
            "const REVISION = 'R5'",
            "FromHexString('#a9dce6')",
            'material.alpha = 0.52',
            'material.disableLighting = true',
            'material.needDepthPrePass = false',
            'material.disableDepthWrite = true',
            "metadata.livePanelKey === 'season-current-v304'",
            "metadata.livePanelKey === 'pr-celebration-v304'",
            "metadata.livePanelKey === 'four-seasons-v304'",
            'sideOrientation:B.Mesh.FRONTSIDE',
            "'hacia centro'",
            "'hacia exterior'",
            'face.billboardMode = B.Mesh.BILLBOARDMODE_NONE',
            'face.rotation.set(0, angle, 0)',
            '__UCAN_GLOBAL_VISUAL_V304_R5__'
          ];
          const missing = required.filter(value => !source.includes(value));
          if (missing.length) throw new Error(`Marcadores V304 R5 ausentes: ${missing.join(', ')}`);
          if (source.includes('scene.onBeforeRenderObservable.add')) throw new Error('R5 no debe escanear la escena en cada cuadro.');
          console.log({ markers:required.length, browserGlass:true, twoFrontFaces:true });
          NODE

      - name: Validar cargador campus y versión
        run: |
          grep -Fi "X-UCAN-Global-Visual-Revision: R5" /tmp/campus-v304-r5.headers
          grep -Fi "X-UCAN-Browser-Glass: R5" /tmp/campus-v304-r5.headers
          grep -Fi "X-UCAN-Seasonal-Signs: R5" /tmp/campus-v304-r5.headers
          node - <<'NODE'
          const fs = require('fs');
          const keyboard = fs.readFileSync('/tmp/keyboard-v266.js', 'utf8');
          const campus = fs.readFileSync('/tmp/campus-v304-r5.html', 'utf8');
          const version = JSON.parse(fs.readFileSync('/tmp/version-v304-r5.json', 'utf8'));
          const r4 = 'ucan_v304_quest_glass_rails_holiday_r4.js';
          const protection = 'ucan_v304_r4_geometry_protection.js';
          const r5 = 'ucan_v304_global_glass_signs_r5.js';
          if (!(keyboard.indexOf(r4) >= 0 && keyboard.indexOf(protection) > keyboard.indexOf(r4) && keyboard.indexOf(r5) > keyboard.indexOf(protection))) {
            throw new Error('El orden debe ser R4, protección y R5.');
          }
          if (!campus.includes('ucan_v266_keyboard_jump.js?build=V304-20260725-GLOBAL-R5-LOADER')) throw new Error('El campus no usa el identificador R5.');
          if (campus.includes('ucan_v305_') || campus.includes('ucan_v306_')) throw new Error('Se reactivó una versión posterior a V304.');
          const checks = {
            revision:version.globalVisualRevision === 'R5',
            glass:version.browserGlassCorrected === true && version.browserGlassColor === '#a9dce6' && version.browserGlassAlpha === 0.52,
            depth:version.browserGlassDepthPrePassDisabled === true && version.browserGlassDepthWriteDisabled === true,
            signs:version.seasonalBoardsTwoFrontFaces === true && version.seasonalBoardsBacksideMirroringDisabled === true,
            orientation:version.seasonalBoardsBillboardDisabled === true && version.seasonalBoardsUpright === true,
            environments:version.seasonalBoardsBrowserQuestMR === true,
            r4:version.questR4Preserved === true
          };
          if (!Object.values(checks).every(Boolean)) throw new Error(JSON.stringify({ checks, version }, null, 2));
          console.log({ checks });
          NODE

      - name: Construir Docker V304 R5
        run: docker build -t ucan-academic:v304-r5 .

      - name: Detener servidor
        if: always()
        run: |
          test -f /tmp/ucan-v304-r5.pid && kill "$(cat /tmp/ucan-v304-r5.pid)" || true
