name: Legacy Carteles e Interacción V304 R6 (archived)
on:
  workflow_dispatch:

jobs:
  validate-v304-r6:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis y auditorías R6 R5 R4
        run: |
          npm run check
          npm run audit:visual-interaction-v304-r6
          npm run audit:global-v304-r5
          npm run audit:quest-v304-r4

      - name: Iniciar servidor autenticado
        env:
          PORT: 3019
          ADMIN_INITIAL_PASSWORD: GitHub-Test-UCAN-2026!
        run: |
          npm start > /tmp/ucan-v304-r6.log 2>&1 &
          echo $! > /tmp/ucan-v304-r6.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3019/health > /tmp/health-v304-r6.json && break
            sleep 1
          done

          curl -fsS "http://127.0.0.1:3019/js/ucan_v304_signs_terrace_interaction_r6.js?build=V304-20260728-UPRIGHT-SIGNS-TERRACE-XR-INTERACTION-R6" > /tmp/runtime-r6.js
          curl -fsS "http://127.0.0.1:3019/js/ucan_v304_r6_legacy_sign_guard.js?build=V304-20260728-R6-LEGACY-SIGN-GUARD" > /tmp/guard-r6.js
          curl -fsS "http://127.0.0.1:3019/js/ucan_v266_keyboard_jump.js" > /tmp/loader-v266.js
          curl -fsS http://127.0.0.1:3019/version > /tmp/version-v304-r6.json

          CI_USER="civ304r6${GITHUB_RUN_ID}"
          curl -fsS -c /tmp/cookies-v304-r6.txt \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${CI_USER}\",\"displayName\":\"CI V304 R6\",\"email\":\"${CI_USER}@example.test\",\"password\":\"CI-V304-R6-2026!\"}" \
            http://127.0.0.1:3019/api/auth/register > /tmp/register-v304-r6.json
          curl -fsS -D /tmp/campus-v304-r6.headers -b /tmp/cookies-v304-r6.txt http://127.0.0.1:3019/campus > /tmp/campus-v304-r6.html

      - name: Validar sintaxis de runtime guardia y cargador
        run: |
          node --check /tmp/runtime-r6.js
          node --check /tmp/guard-r6.js
          node --check /tmp/loader-v266.js

      - name: Validar textura y orientación R6
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('/tmp/runtime-r6.js', 'utf8');
          const required = [
            "const REVISION = 'R6'",
            'ctx.drawImage(source, 0, 0, size.width, size.height)',
            'record.texture.update(true)',
            'sideOrientation:B.Mesh.FRONTSIDE',
            "'hacia centro'",
            "'hacia exterior'",
            'face.rotation.set(0, angle, 0)',
            'face.billboardMode = B.Mesh.BILLBOARDMODE_NONE',
            'hiddenByCorrectedBoardV304R6',
            '__UCAN_VISUAL_INTERACTION_V304_R6__'
          ];
          const missing = required.filter(value => !source.includes(value));
          if (missing.length) throw new Error(`Marcadores de orientación R6 ausentes: ${missing.join(', ')}`);
          console.log({ markers:required.length, copiedCanvas:true, invertY:true, frontFaces:true });
          NODE

      - name: Validar interacción de terraza R6
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('/tmp/runtime-r6.js', 'utf8');
          const required = [
            "selectFromController(controller, 'trigger')",
            "selectFromController(controller, 'primary')",
            "selectFromController(controller, 'joystick')",
            'pickFromRay(controllerRay(controller))',
            'headGazeRay()',
            "type === 'celestial' ? 21 * Math.PI / 180 : 13 * Math.PI / 180",
            "new B.TransformNode('Panel información terraza R6'",
            'state.infoTexture.update(true)',
            "hand === 'right' ? ['b-button'] : ['y-button']"
          ];
          const missing = required.filter(value => !source.includes(value));
          if (missing.length) throw new Error(`Marcadores de interacción R6 ausentes: ${missing.join(', ')}`);
          console.log({ markers:required.length, trigger:true, primary:true, joystick:true, gazeFallback:true, ownPanel:true });
          NODE

      - name: Validar guardia de carteles antiguos R4 R5
        run: |
          grep -F "const REVISION = 'R6-GUARD'" /tmp/guard-r6.js
          grep -F "metadata.globalBoardFaceV304R5 === true" /tmp/guard-r6.js
          grep -F "metadata.holidayBoardPuertoRicoV304R4 === true" /tmp/guard-r6.js
          grep -F "state.scene.onBeforeRenderObservable.add" /tmp/guard-r6.js
          grep -F "fullSceneScanPerFrame:false" /tmp/guard-r6.js
          grep -F "correctedR6FacesForcedVisible:true" /tmp/guard-r6.js

      - name: Validar cadena de carga R4 R5 R6 y guardia
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const loader = fs.readFileSync('/tmp/loader-v266.js', 'utf8');
          const scriptsPresent = [
            'ucan_v304_quest_glass_rails_holiday_r4.js',
            'ucan_v304_r4_geometry_protection.js',
            'ucan_v304_global_glass_signs_r5.js',
            'ucan_v304_signs_terrace_interaction_r6.js',
            'ucan_v304_r6_legacy_sign_guard.js'
          ].every(value => loader.includes(value));
          const executionChain = loader.includes("runtime.addEventListener('load', loadProtectionAndR5)") &&
            loader.includes("protection.addEventListener('load', loadGlobalVisualR5)") &&
            loader.includes("runtime.addEventListener('load', loadInteractionR6)") &&
            loader.includes("runtime.addEventListener('load', loadR6Guard)");
          if (!scriptsPresent || !executionChain) throw new Error(JSON.stringify({ scriptsPresent, executionChain }));
          console.log({ scriptsPresent, executionChain });
          NODE

      - name: Registrar encabezados diagnósticos R6
        run: |
          cat /tmp/campus-v304-r6.headers
          grep -Fi "X-UCAN-Visual-Interaction-Revision: R6" /tmp/campus-v304-r6.headers || true
          grep -Fi "X-UCAN-Seasonal-Signs: R6" /tmp/campus-v304-r6.headers || true
          grep -Fi "X-UCAN-Terrace-Interaction: R6" /tmp/campus-v304-r6.headers || true

      - name: Validar campus R6
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const campus = fs.readFileSync('/tmp/campus-v304-r6.html', 'utf8');
          if (!campus.includes('ucan_v266_keyboard_jump.js?build=V304-20260728-R6-SIGNS-TERRACE-LOADER')) throw new Error('El campus no usa el identificador R6.');
          if (campus.includes('ucan_v305_') || campus.includes('ucan_v306_')) throw new Error('Se reactivó una versión posterior a V304.');
          console.log({ cacheBuild:'R6', laterVersionsAbsent:true });
          NODE

      - name: Validar endpoint version R6
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('/tmp/version-v304-r6.json', 'utf8'));
          const checks = {
            revision:version.visualInteractionRevision === 'R6',
            signs:version.seasonalSignsCopiedFromSourceCanvas === true && version.seasonalSignsDynamicTextureInvertY === true && version.seasonalSignsTwoFrontFacesR6 === true && version.seasonalSignsBacksideDisabledR6 === true,
            guard:version.r6LegacySignGuardEnabled === true && version.r6LegacySignsSuppressedBeforeRender === true && version.seasonalOriginalBoardsHiddenByR6 === true,
            glassRails:version.r5GlobalGlassPreserved === true && version.r4QuestRailsPreserved === true,
            selection:version.terraceTriggerSelectionR6 === true && version.terracePrimarySelectionR6 === true && version.terraceJoystickSelectionR6 === true && version.terraceHeadGazeFallbackR6 === true,
            panel:version.terraceOwnXRInfoPanelR6 === true && version.terraceInfoTextureInvertYR6 === true,
            runtimeInfo:version.universalInfoTextureRuntimeCorrectedR6 === true && version.skyInfoTextureRuntimeCorrectedR6 === true
          };
          console.log(JSON.stringify({ checks, version }, null, 2));
          if (!Object.values(checks).every(Boolean)) throw new Error('El endpoint /version no contiene todos los indicadores R6.');
          NODE

      - name: Construir Docker V304 R6
        run: docker build -t ucan-academic:v304-r6 .

      - name: Detener servidor
        if: always()
        run: |
          test -f /tmp/ucan-v304-r6.pid && kill "$(cat /tmp/ucan-v304-r6.pid)" || true
