name: Legacy XR Landing V326 (archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-audit:
    name: Verify archived V326 source only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify historical source remains valid
        run: |
          node --check public/js/ucan_v326_xr_landing_release.js
          node --check verify_v326_xr_landing_release.js
          echo 'V326 is archived and is not loaded by the production WebXR runtime. V328 owns vertical movement.'
