name: Floor Two Lock V320

on:
  push:
    branches: [main]
    paths:
      - 'auth-compat-v320-floor-lock.js'
      - 'public/js/ucan_v320_social_loader.js'
      - 'public/js/ucan_v320_floor_lock_controller.js'
      - 'verify_v320_floor_lock.js'
      - 'verify_voice_rooms_v306.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/floor-two-lock-v320.yml'
  pull_request:
    paths:
      - 'auth-compat-v320-floor-lock.js'
      - 'public/js/ucan_v320_social_loader.js'
      - 'public/js/ucan_v320_floor_lock_controller.js'
      - 'verify_v320_floor_lock.js'
      - 'verify_voice_rooms_v306.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/floor-two-lock-v320.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate sticky floor two state
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run repository tests
        run: npm test
      - name: Start V320 application
        env:
          PORT: '3100'
          DATA_DIR: ${{ runner.temp }}/ucan-v320-data
          ADMIN_INITIAL_USERNAME: admin
          ADMIN_INITIAL_PASSWORD: Floor-V320-Admin7!
          ADMIN_INITIAL_EMAIL: admin-v320@example.test
        run: |
          mkdir -p "$DATA_DIR"
          node -r ./auth-compat-v320-floor-lock.js server.js > "$RUNNER_TEMP/ucan-v320-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ucan-v320-server.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/health > "$RUNNER_TEMP/health.json"; then exit 0; fi
            sleep 0.3
          done
          cat "$RUNNER_TEMP/ucan-v320-server.log"
          exit 1
      - name: Verify version flags
        run: |
          curl -fsS http://127.0.0.1:3100/version > "$RUNNER_TEMP/version.json"
          node - <<'NODE'
          const fs=require('fs');
          for (const name of ['health','version']) {
            const value=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}.json`,'utf8'));
            if (value.version !== 'V320') throw new Error(`${name}: versión ${value.version}`);
            if (value.floorTwoStickyLock !== true) throw new Error(`${name}: bloqueo Piso 2 inactivo`);
            if (value.automaticReturnToFloor1 !== false) throw new Error(`${name}: retorno automático permitido`);
            if (value.intentionalDirectionRequired !== true) throw new Error(`${name}: dirección intencional no requerida`);
          }
          NODE
      - name: Login and inspect transformed campus
        run: |
          curl -fsS -c "$RUNNER_TEMP/cookies.txt" -H 'Content-Type: application/json' \
            -d '{"login":"admin","password":"Floor-V320-Admin7!"}' \
            http://127.0.0.1:3100/api/auth/login > "$RUNNER_TEMP/login.json"
          curl -fsS -b "$RUNNER_TEMP/cookies.txt" http://127.0.0.1:3100/campus > "$RUNNER_TEMP/campus.html"
          grep -q 'UCAN Academic Mall V320' "$RUNNER_TEMP/campus.html"
          grep -q 'ucan_v320_social_loader.js' "$RUNNER_TEMP/campus.html"
          ! grep -q 'ucan_v319_social_loader.js' "$RUNNER_TEMP/campus.html"
          curl -fsS -b "$RUNNER_TEMP/cookies.txt" http://127.0.0.1:3100/js/ucan_v316_complete_browser_vr_audit.js > "$RUNNER_TEMP/locomotion.js"
          grep -q '__UCAN_FLOOR_ROUTE_CONTROLLER_V320__?.resolveGround' "$RUNNER_TEMP/locomotion.js"
          grep -q "setFloor?.(state.ground, 'panel-navigation')" "$RUNNER_TEMP/locomotion.js"
          grep -q "setFloor?.(state.floor, 'teleport')" "$RUNNER_TEMP/locomotion.js"
          grep -q "setFloor?.(floor, 'reset')" "$RUNNER_TEMP/locomotion.js"
      - name: Stop application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ucan-v320-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/ucan-v320-server.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/ucan-v320-server.log" ]; then tail -n 160 "$RUNNER_TEMP/ucan-v320-server.log"; fi
