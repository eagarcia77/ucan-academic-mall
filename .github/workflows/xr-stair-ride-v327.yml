name: Legacy XR Stair Ride V327 (archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-audit:
    name: Verify archived V327 source only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify historical source remains valid
        run: |
          node --check public/js/ucan_v327_xr_stair_ride_height.js
          node --check verify_v327_xr_stair_ride_height.js
          echo 'V327 is archived and is not loaded by the production WebXR runtime. V328 owns height, stairs and exact landings.'
