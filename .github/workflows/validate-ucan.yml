name: Validate UCAN Academic Mall

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        script:
          - check
          - test:persistence-v311
          - audit:v314
          - audit:v322
          - audit:v323
          - audit:v324
          - audit:v325
          - audit:v328
          - audit:voice-v306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ${{ matrix.script }}
        run: npm run "${{ matrix.script }}"
